# 金十DSH nginx 配置（Windows，本机部署）
# 静态站 C:\nginx\html\DSH + API 反代 127.0.0.1:8787（见 docs/DEPLOY.md）
# 注意：监听 8088（80 为特权端口，沙箱/防火墙环境可能受限；内网访问 http://<IP>:8088/DSH/）
worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 预压缩 .gz 直出（视图层归档时已 gzip，见 DATA_MODEL §13）
    gzip_static on;
    gzip_types application/json application/javascript text/css;
    gzip_vary on;

    server {
        listen       8088;
        server_name  localhost;

        # V0.5：仅允许本机和 RFC1918 内网访问；公网来源直接拒绝。
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        # ---- Web 视图层：历史日文件不可变 → 永久缓存（切换历史日期 0 网络请求）----
        location ~* "^/DSH/data/web/day_[0-9]{8}\.json(\.gz)?$" {
            alias C:/nginx/html/DSH/data/web/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /DSH/data/web/index.json {
            alias C:/nginx/html/DSH/data/web/index.json;
            add_header Cache-Control "public, max-age=300";
        }
        location = /DSH/data/web/day_latest.json {
            alias C:/nginx/html/DSH/data/web/day_latest.json;
            add_header Cache-Control "no-cache";
        }

        # ---- 静态工作台 ----
        location /DSH/ {
            alias C:/nginx/html/DSH/;
            index index.html;
            try_files $uri $uri/ /DSH/index.html;
        }

        # ---- API 反代（market-data-service，127.0.0.1:8787）----
        location /DSH/api/ {
            proxy_pass http://127.0.0.1:8787/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- 根路径重定向到工作台 ----
        location = / {
            return 302 /DSH/;
        }
    }
}
