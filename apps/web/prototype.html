<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金十DSH · 题材工作台</title>
<style>
/* ===== 曜石红玉主题（参考 themeku_theme.css） ===== */
:root{
  --c-bg:#f5f5f5;--c-surface:#ffffff;--c-surface-alt:#fafafa;
  --c-border:#e8e8e8;--c-border-light:#f0f0f0;
  --c-text:#333333;--c-text-secondary:#666666;--c-text-muted:#999999;--c-text-inverse:#ffffff;
  --c-primary:#e24b4a;--c-primary-dark:#c0392b;--c-primary-light:#fff5f5;--c-primary-border:#ffd4d4;
  --c-accent:#ff9800;--c-success:#27ae60;--c-danger:#d63031;
  --c-tag-bg:#f5f5f5;--c-hover:#fafafa;--c-active-bg:#fbeaf0;
  --c-l2-bg:#fafbfc;--c-l2-hover:#f0f0f0;
  --c-input-bg:#ffffff;--c-input-border:#dddddd;
  --c-sidebar-bg:#ffffff;--c-mainbar-bg:#e24b4a;--c-mainbar-text:#ffffff;
  --c-code-fg:#e24b4a;--c-link:#e24b4a;--c-gold:#e6a817;
  --shadow-row:0 0 6px rgba(226,75,74,0.15);
  --gradient-pill:linear-gradient(135deg,#e24b4a,#c0392b);
  --c-warn-bg:#fff7e6;--c-warn-border:#ffd591;--c-warn-text:#8a5a00;
}
[data-theme="dark"]{
  --c-bg:#12161C;--c-surface:#1A1F2B;--c-surface-alt:#222836;
  --c-border:#2A3040;--c-border-light:#1E2430;
  --c-text:#E8EAED;--c-text-secondary:#9AA0B0;--c-text-muted:#5C6370;--c-text-inverse:#12161C;
  --c-primary:#E05555;--c-primary-dark:#CC4444;--c-primary-light:#221618;--c-primary-border:#4D2A28;
  --c-accent:#E8A043;--c-success:#3DBE70;--c-danger:#E05555;
  --c-tag-bg:#222836;--c-hover:#222836;--c-active-bg:#221618;
  --c-l2-bg:#181D26;--c-l2-hover:#1E2430;
  --c-input-bg:#161B24;--c-input-border:#2A3040;
  --c-sidebar-bg:#1A1F2B;--c-mainbar-bg:linear-gradient(135deg,#1A1F2E,#251A26);--c-mainbar-text:#E8EAED;
  --c-code-fg:#E05555;--c-link:#E05555;--c-gold:#F0B860;
  --shadow-row:0 0 12px rgba(224,85,85,0.20);
  --gradient-pill:linear-gradient(135deg,#E05555,#CC4444);
  --c-warn-bg:#26221a;--c-warn-border:#4d3d28;--c-warn-text:#E8A043;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--c-text);background:var(--c-bg)}
a{color:var(--c-link);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== 三栏容器 ===== */
.container{display:flex;height:100vh;overflow:hidden}

/* ===== 左栏 280px ===== */
.sidebar{width:280px;flex-shrink:0;background:var(--c-sidebar-bg);border-right:1px solid var(--c-border);display:flex;flex-direction:column}
.sidebar-top{background:var(--gradient-pill);color:var(--c-mainbar-text);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.sidebar-top .left h2{font-size:15px;font-weight:600;letter-spacing:.3px}
.sidebar-top .left .meta{font-size:11.5px;opacity:.85;margin-top:3px}
.theme-toggle{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:14px;width:30px;height:30px;border-radius:8px;cursor:pointer;flex-shrink:0}
.theme-toggle:hover{background:rgba(255,255,255,.28)}
.search-wrap{padding:8px 12px;border-bottom:1px solid var(--c-border)}
.search-wrap input{width:100%;padding:6px 10px;border:1px solid var(--c-input-border);border-radius:6px;background:var(--c-input-bg);font-size:12.5px;color:var(--c-text);outline:none}
.search-wrap input:focus{border-color:var(--c-primary)}
.idx-bar{display:flex;border-bottom:1px solid var(--c-border);font-size:11px}
.idx-btn{flex:1;text-align:center;padding:7px 0;cursor:pointer;color:var(--c-text-muted);border-bottom:2px solid transparent;transition:all .2s;user-select:none}
.idx-btn:hover{color:var(--c-primary);background:var(--c-hover)}
.idx-btn.on{color:var(--c-primary);border-bottom-color:var(--c-primary);background:var(--c-primary-light);font-weight:600}
.sort-bar{display:flex;border-bottom:1px solid var(--c-border);font-size:11px}
.sort-btn{flex:1;text-align:center;padding:7px 0;cursor:pointer;color:var(--c-text-muted);border-bottom:2px solid transparent;transition:all .2s;user-select:none}
.sort-btn:hover{color:var(--c-primary);background:var(--c-hover)}
.sort-btn.on{color:var(--c-primary);border-bottom-color:var(--c-primary);background:var(--c-primary-light);font-weight:600}
.theme-list{flex:1;overflow-y:auto;min-height:0}
.ti{padding:9px 12px;border-bottom:1px solid var(--c-border-light);cursor:pointer;transition:background .15s}
.ti:hover{background:var(--c-hover)}
.ti.sel{background:var(--c-active-bg);border-left:3px solid var(--c-primary)}
.ti .t1{display:flex;align-items:center;gap:6px}
.ti .nm{flex:1;font-weight:600;font-size:13px;color:var(--c-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .t2{display:flex;gap:5px;margin-top:5px}
.badge{font-size:10px;padding:1px 6px;border-radius:8px;white-space:nowrap}
.b-zt{background:var(--c-primary-light);color:var(--c-primary);font-weight:600}
.b-score{background:var(--c-tag-bg);color:var(--c-text-secondary)}
.b-hot{background:var(--c-warn-bg);color:var(--c-warn-text);font-weight:600}
.b-cnt{background:var(--c-tag-bg);color:var(--c-text-muted)}
.ti .chg{font-size:11px;font-weight:600}
.chg.up{color:var(--c-primary)}.chg.dn{color:var(--c-success)}

/* ===== 中栏 ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-bar{background:var(--gradient-pill);color:var(--c-mainbar-text);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.main-bar h1{font-size:16px;font-weight:500;letter-spacing:.3px}
.main-bar .meta{font-size:11.5px;opacity:.85}
.content{flex:1;overflow-y:auto;padding:16px}
.crumbs{font-size:12px;color:var(--c-text-muted);margin-bottom:12px}
.crumbs .cr{cursor:pointer;color:var(--c-link)}
.crumbs .sep{margin:0 5px;color:var(--c-border)}

/* 摘要卡 */
.summary{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sum{background:var(--c-surface);border:1px solid var(--c-border);border-radius:8px;padding:9px 16px;text-align:center;min-width:84px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sum .n{font-size:18px;font-weight:700;color:var(--c-text)}
.sum .n.up{color:var(--c-primary)}.sum .n.dn{color:var(--c-success)}.sum .n.gold{color:var(--c-gold)}
.sum .l{font-size:10.5px;color:var(--c-text-muted);margin-top:2px}

/* 概念层级表（themeku 样式） */
.table-section{background:var(--c-surface);border:1px solid var(--c-border);border-radius:8px;margin-bottom:14px;overflow:hidden}
.table-section h3{padding:10px 16px;font-size:13px;color:var(--c-primary);background:var(--c-primary-light);border-bottom:1px solid var(--c-primary-border);font-weight:600}
.table-scroll{overflow-x:auto;max-height:52vh;overflow-y:auto}
table.concept-table{width:100%;border-collapse:collapse;font-size:12.5px}
.concept-table th{padding:8px 12px;text-align:left;background:var(--c-surface-alt);color:var(--c-text-secondary);font-weight:600;border-bottom:1px solid var(--c-border);position:sticky;top:0}
.concept-table td{padding:7px 12px;border-bottom:1px solid var(--c-border-light);vertical-align:top}
.concept-table tr:hover td{background:var(--c-hover)}
.td-l1{width:130px;font-weight:600;color:var(--c-text);border-right:1px solid var(--c-border-light);background:var(--c-l2-bg)}
.td-l2{width:150px;color:var(--c-text-secondary);border-right:1px solid var(--c-border-light);background:var(--c-l2-bg)}
.td-l2 .l2-name{cursor:pointer;color:var(--c-text-secondary)}
.td-l2 .l2-name:hover{color:var(--c-primary);text-decoration:underline}
.l1-name{cursor:pointer}
.l1-name:hover{color:var(--c-primary);text-decoration:underline}
.stock-cell{line-height:1.9}
.stk-chip{display:inline-block;margin:1px 4px 1px 0;padding:1px 7px;border:1px solid var(--c-border);border-radius:6px;background:var(--c-surface-alt);cursor:pointer;font-size:12px;color:var(--c-text);white-space:nowrap}
.stk-chip:hover{border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-light)}
.stk-chip .c{color:var(--c-text-muted);font-size:10.5px;margin-left:3px}
.stk-chip.zt{border-color:var(--c-primary-border);background:var(--c-primary-light);color:var(--c-primary);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--c-text-muted)}

/* 子板块/筛选（板块视图） */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 11px;border-radius:13px;font-size:12px;cursor:pointer;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-secondary)}
.chip:hover{border-color:var(--c-primary);color:var(--c-primary)}
.filters{display:flex;gap:6px;margin-bottom:10px}
.ft{padding:4px 12px;border-radius:6px;font-size:11.5px;cursor:pointer;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-secondary)}
.ft.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
table.plain{width:100%;border-collapse:collapse;background:var(--c-surface);border:1px solid var(--c-border);border-radius:8px;overflow:hidden;font-size:12.5px}
table.plain th,table.plain td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--c-border-light)}
table.plain th{background:var(--c-surface-alt);color:var(--c-text-secondary);font-weight:600}
table.plain td.l,table.plain th.l{text-align:left}
table.plain tbody tr:hover td{background:var(--c-hover)}
.placeholder{border:1px dashed var(--c-border);border-radius:8px;padding:20px;text-align:center;color:var(--c-text-muted);font-size:12px;margin-bottom:14px;background:var(--c-surface)}

/* ===== 右栏 live-panel 280px ===== */
.live-panel{width:280px;flex-shrink:0;background:var(--c-sidebar-bg);border-left:1px solid var(--c-border);display:flex;flex-direction:column;overflow:hidden}
.live-title{padding:11px 14px;font-size:12px;font-weight:700;color:var(--c-text-secondary);border-bottom:1px solid var(--c-border);letter-spacing:.5px}
.live-list{flex:1;overflow-y:auto;padding:10px 12px}
.l-card{background:var(--c-surface-alt);border:1px solid var(--c-border);border-radius:8px;padding:10px;margin-bottom:10px}
.l-card h4{font-size:12px;color:var(--c-text);margin-bottom:6px;font-weight:600}
.l-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--c-border-light)}
.l-row:last-child{border-bottom:0}
.l-row .k{color:var(--c-text-muted)}
.l-row .v{color:var(--c-text);font-weight:600}
.l-row .v.up{color:var(--c-primary)}.l-row .v.dn{color:var(--c-success)}
.r-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;cursor:pointer;margin:2px 3px 2px 0;border:1px solid var(--c-border)}
.r-tag.sec{background:var(--c-primary-light);border-color:var(--c-primary-border);color:var(--c-primary)}
.r-tag.thm{background:var(--c-warn-bg);border-color:var(--c-warn-border);color:var(--c-warn-text)}
.r-tag:hover{filter:brightness(.96)}
.reason{font-size:12px;color:var(--c-text-secondary);line-height:1.7;word-break:break-all}
</style>
</head>
<body>
<div class="container">
  <!-- 左栏 -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="left"><h2>📈 金十DSH · 题材工作台</h2><div class="meta" id="sideMeta">- 收盘数据</div></div>
      <button class="theme-toggle" id="themeToggle" title="切换深色/浅色">🌙</button>
    </div>
    <div class="search-wrap"><input id="idxSearch" placeholder="🔍 搜索题材 / 板块…"></div>
    <div class="idx-bar">
      <div class="idx-btn on" data-idx="theme">📚 题材</div>
      <div class="idx-btn" data-idx="sector">📊 板块</div>
    </div>
    <div class="sort-bar" id="sortBar"></div>
    <div class="theme-list" id="idxList"></div>
  </div>

  <!-- 中栏 -->
  <div class="main">
    <div class="main-bar"><h1 id="mainTitle">题材工作台</h1><div class="meta" id="mainMeta">2026-08-14 · 收盘</div></div>
    <div class="content" id="content"></div>
  </div>

  <!-- 右栏 -->
  <div class="live-panel">
    <div class="live-title">📌 关联面板</div>
    <div class="live-list" id="live"></div>
  </div>
</div>

<script>
'use strict';
var DAY, THEMES, TREE, STOCKS, SECTORS, THEME_STOCKS;
var idxMode='theme', sortKey='zt', selected=null;
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function code6(sid){return String(sid).slice(2);}
function fetchJ(u){return fetch(u).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json();});}
function ztSet(){return new Set((DAY.limitup||[]).map(function(e){return e.stock_id;}));}
function ztOf(sid){return ztSet().has(sid);}
function fmtMoney(n){n=Number(n)||0;var a=Math.abs(n);if(a>=1e8)return(n/1e8).toFixed(1)+'亿';if(a>=1e4)return(n/1e4).toFixed(1)+'万';return n.toFixed(0);}
function fmtPct(n){n=Number(n);return isNaN(n)?'-':((n>=0?'+':'')+n.toFixed(2)+'%');}

/* 题材综合得分 = 涨停×8 + 热度 + 成分 */
function themeScore(tid){
  var th=THEMES[tid]||{}, mem=THEME_STOCKS[tid]||[];
  var zt=mem.filter(ztOf).length;
  return zt*8 + Math.min((th.hot||0)/300, 20) + Math.min((th.stock_count||0)/25, 10);
}

/* ---------- 数据 ---------- */
function loadAll(){
  return Promise.all([
    fetchJ('data/web/day_latest.json').then(function(d){DAY=d;}),
    fetchJ('data/web/themes.json').then(function(d){THEMES=d;}),
    fetchJ('data/web/themes_tree.json').then(function(d){TREE=d;}),
    fetchJ('data/web/theme_stocks.json').then(function(d){THEME_STOCKS=d;}),
    fetchJ('data/web/stocks_slim.json').then(function(d){STOCKS=d;}),
    fetchJ('data/web/sectors.json').then(function(d){SECTORS=d;})
  ]).then(function(){
    $('#sideMeta').textContent = DAY.date + ' 收盘 · ' + (DAY.limitup||[]).length + ' 涨停';
  });
}

/* ---------- 索引 ---------- */
function renderSortBar(){
  var modes = idxMode==='theme' ? {zt:'🔥 涨停数',score:'📊 综合得分',cnt:'成分数',hot:'热度'} : {st:'强度',chg:'涨跌%',net:'主力净额'};
  var keys=Object.keys(modes);
  $('#sortBar').innerHTML = keys.map(function(k){ return '<div class="sort-btn'+(sortKey===k?' on':'')+'" data-sort="'+k+'">'+modes[k]+(sortKey===k?' ▼':'')+'</div>'; }).join('');
  $('#sortBar').querySelectorAll('.sort-btn').forEach(function(b){ b.addEventListener('click',function(){ sortKey=b.dataset.sort; renderSortBar(); renderIndex(); }); });
}
function renderIndex(){
  var kw=($('#idxSearch').value||'').trim();
  var html = idxMode==='theme' ? themeRows(kw) : sectorRows(kw);
  $('#idxList').innerHTML = html || '<div class="empty">无匹配</div>';
  $('#idxList').querySelectorAll('.ti').forEach(function(r){ r.addEventListener('click',function(){ selected={type:r.dataset.type,id:r.dataset.id}; renderAll(); }); });
}
function themeRows(kw){
  var ids=Object.keys(THEMES).filter(function(t){ return !kw || THEMES[t].name.indexOf(kw)>=0; });
  ids.sort(function(a,b){
    if(sortKey==='score') return themeScore(b)-themeScore(a);
    if(sortKey==='zt') return (THEME_STOCKS[b]||[]).filter(ztOf).length - (THEME_STOCKS[a]||[]).filter(ztOf).length;
    if(sortKey==='hot') return (THEMES[b].hot||0)-(THEMES[a].hot||0);
    return (THEMES[b].stock_count||0)-(THEMES[a].stock_count||0);
  });
  return ids.map(function(t){
    var th=THEMES[t], mem=THEME_STOCKS[t]||[], zt=mem.filter(ztOf).length;
    var sel=selected&&selected.type==='theme'&&selected.id===t?' sel':'';
    return '<div class="ti'+sel+'" data-type="theme" data-id="'+esc(t)+'">'+
      '<div class="t1"><span class="nm">'+esc(th.name)+'</span></div>'+
      '<div class="t2">'+(zt?'<span class="badge b-zt">涨停 '+zt+'</span>':'')+
      '<span class="badge b-score">'+Math.round(themeScore(t))+'分</span>'+
      '<span class="badge b-cnt">'+th.stock_count+'只</span>'+
      (th.hot?'<span class="badge b-hot">🔥'+th.hot+'</span>':'')+'</div></div>';
  }).join('');
}
function sectorRows(kw){
  var secs=(DAY.sectors||[]).filter(function(s){ return !kw || s.name.indexOf(kw)>=0; });
  if(sortKey==='chg') secs=secs.slice().sort(function(a,b){return (b.change||0)-(a.change||0);});
  if(sortKey==='net') secs=secs.slice().sort(function(a,b){return (b.mainNet||0)-(a.mainNet||0);});
  return secs.map(function(s){
    var n=Object.keys(STOCKS).filter(function(k){return (STOCKS[k].s||[]).indexOf(s.id)>=0;}).length;
    var sel=selected&&selected.type==='sector'&&selected.id===s.id?' sel':'';
    return '<div class="ti'+sel+'" data-type="sector" data-id="'+esc(s.id)+'">'+
      '<div class="t1"><span class="nm">'+esc(s.name)+'</span><span class="chg '+(s.change>=0?'up':'dn')+'">'+fmtPct(s.change)+'</span></div>'+
      '<div class="t2"><span class="badge b-score">'+fmtMoney(s.strength)+'</span><span class="badge b-cnt">'+n+'只</span>'+
      '<span class="badge '+(s.mainNet>=0?'b-zt':'b-score')+'">主力 '+fmtMoney(s.mainNet)+'</span></div></div>';
  }).join('');
}

/* ---------- 详情 ---------- */
function themeDetail(tid){
  var th=THEMES[tid]||{}, tree=(TREE[tid]||{}).tree||[], mem=THEME_STOCKS[tid]||[];
  var zt=mem.filter(ztOf).length;
  var head='<div class="crumbs"><span class="cr" data-go="home">工作台</span><span class="sep">/</span>'+esc(th.name)+'</div>'+
    '<div class="summary">'+
    '<div class="sum"><div class="n up">'+zt+'</div><div class="l">涨停</div></div>'+
    '<div class="sum"><div class="n">'+th.stock_count+'</div><div class="l">成分股</div></div>'+
    '<div class="sum"><div class="n gold">'+(th.hot||0)+'</div><div class="l">热度</div></div>'+
    '<div class="sum"><div class="n">'+tree.length+'</div><div class="l">主概念</div></div>'+
    '<div class="sum"><div class="n">'+Math.round(themeScore(tid))+'</div><div class="l">综合得分</div></div></div>';
  if(!tree.length) return head+'<div class="empty">无概念层级数据</div>';
  // 概念层级表：主概念 rowspan → 细分概念 → 个股
  var rows='';
  tree.forEach(function(l1){
    var l2s=l1.l2&&l1.l2.length?l1.l2:[{n2:'—',st:l1.st}];
    l2s.forEach(function(l2,li){
      var sts=l2.st||[];
      var cells=sts.map(function(sid){
        var nm=(STOCKS[sid]||{}).n||sid;
        return '<span class="stk-chip'+(ztOf(sid)?' zt':'')+'" data-stk="'+esc(sid)+'">'+esc(nm)+'<span class="c">'+esc(code6(sid))+'</span></span>';
      }).join('');
      rows+='<tr>'+(li===0?'<td class="td-l1" rowspan="'+l2s.length+'"><span class="l1-name" data-con="'+esc(l1.n1)+'">'+esc(l1.n1)+'</span></td>':'')+
        '<td class="td-l2"><span class="l2-name" data-con="'+esc(l2.n2)+'">'+esc(l2.n2)+'</span></td>'+
        '<td><div class="stock-cell">'+(cells||'<span class="muted">-</span>')+'</div></td></tr>';
    });
  });
  return head+'<div class="table-section"><h3>概念层级 ('+tree.length+'个主概念)</h3>'+
    '<div class="table-scroll"><table class="concept-table"><thead><tr><th>主概念</th><th>细分概念</th><th>成分股</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function sectorDetail(s){
  var n=Object.keys(STOCKS).filter(function(k){return (STOCKS[k].s||[]).indexOf(s.id)>=0;});
  var subs=Object.keys(SECTORS).filter(function(x){return SECTORS[x].parent_id===s.id;});
  var rows=n.slice(0,300).map(function(sid){
    var sl=STOCKS[sid]||{};
    var ths=(sl.t||[]).slice(0,3).map(function(x){return '<span class="r-tag thm">'+esc((THEMES[x]||{}).name||x)+'</span>';}).join('');
    return '<tr><td class="l"><span class="stk-chip'+(ztOf(sid)?' zt':'')+'" data-stk="'+esc(sid)+'">'+esc(sl.n||code6(sid))+'<span class="c">'+esc(code6(sid))+'</span></span></td><td class="l">'+ths+'</td>'+(ztOf(sid)?'<td class="l"><span class="badge b-zt">涨停</span></td>':'<td></td>')+'</tr>';
  }).join('');
  return '<div class="crumbs"><span class="cr" data-go="home">工作台</span><span class="sep">/</span>'+esc(s.name)+'</div>'+
    '<div class="summary">'+
    '<div class="sum"><div class="n up">'+n.filter(ztOf).length+'</div><div class="l">涨停</div></div>'+
    '<div class="sum"><div class="n">'+n.length+'</div><div class="l">个股数</div></div>'+
    '<div class="sum"><div class="n '+(s.mainNet>=0?'up':'dn')+'">'+fmtMoney(s.mainNet)+'</div><div class="l">主力净额</div></div>'+
    '<div class="sum"><div class="n">'+fmtMoney(s.strength)+'</div><div class="l">强度</div></div>'+
    '<div class="sum"><div class="n">—</div><div class="l">&gt;6%家数*</div></div></div>'+
    (subs.length?'<div class="chips">'+subs.slice(0,14).map(function(x){return '<span class="chip" data-go="sector" data-id="'+esc(x)+'">'+esc(SECTORS[x].name)+'</span>';}).join('')+'</div>':'')+
    '<div class="placeholder">板块日内分时图（实时采集接入后显示）</div>'+
    '<table class="plain"><thead><tr><th class="l">个股</th><th class="l">题材</th><th>状态</th></tr></thead><tbody>'+(rows||'<tr><td colspan="3" class="empty">无成分</td></tr>')+'</tbody></table>';
}

/* ---------- 右栏 ---------- */
function renderLive(){
  var h='';
  if(!selected){
    var lu=DAY.limitup||[];
    h+='<div class="l-card"><h4>今日盘面</h4>'+
      '<div class="l-row"><span class="k">涨停数</span><span class="v up">'+lu.length+'</span></div>'+
      '<div class="l-row"><span class="k">最高连板</span><span class="v">'+lu.reduce(function(a,e){var m=(e.boards||'').match(/\d+/);return Math.max(a,m?+m[0]:1);},1)+'</span></div></div>'+
      '<div class="l-card"><h4>板块资金流 TOP5</h4>'+
      (DAY.money_flow||[]).slice(0,5).map(function(f){return '<div class="l-row"><span class="k">'+esc(f.name)+'</span><span class="v '+(f.main>=0?'up':'dn')+'">'+fmtMoney(f.main)+'</span></div>';}).join('')+'</div>';
  } else if(selected.type==='stock'){
    var sl=STOCKS[selected.id]||{};
    var lu0=(DAY.limitup||[]).filter(function(e){return e.stock_id===selected.id;})[0];
    h+='<div class="l-card"><h4>'+esc(sl.n||selected.id)+' · 双维归属</h4>'+
      '<div>'+(sl.s||[]).map(function(x){return '<span class="r-tag sec" data-go="sector" data-id="'+esc(x)+'">'+esc((SECTORS[x]||{}).name||x)+'</span>';}).join('')||'<span class="muted">无板块</span>'+'</div>'+
      '<div style="margin-top:6px">'+((sl.t||[]).slice(0,8).map(function(x){return '<span class="r-tag thm" data-go="theme" data-id="'+esc(x)+'">'+esc((THEMES[x]||{}).name||x)+'</span>';}).join('')||'<span class="muted">无题材</span>')+'</div></div>'+
      (lu0?'<div class="l-card"><h4>涨停原因（'+lu0.sourceCount+'源）</h4><div class="reason">'+esc(lu0.reason||'')+'</div></div>':'');
  } else if(selected.type==='theme'){
    var mem=THEME_STOCKS[selected.id]||[];
    var cnt={}; mem.forEach(function(sid){(STOCKS[sid]||{}).s.forEach(function(x){cnt[x]=(cnt[x]||0)+1;});});
    var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,8);
    h+='<div class="l-card"><h4>关联板块 TOP（成分重合）</h4>'+
      top.map(function(x){return '<span class="r-tag sec" data-go="sector" data-id="'+esc(x)+'">'+esc((SECTORS[x]||{}).name||x)+' <b>'+cnt[x]+'</b></span>';}).join('')+'</div>';
  } else if(selected.type==='sector'){
    var n=Object.keys(STOCKS).filter(function(k){return (STOCKS[k].s||[]).indexOf(selected.id)>=0;});
    var c2={}; n.forEach(function(sid){(STOCKS[sid]||{}).t.forEach(function(x){c2[x]=(c2[x]||0)+1;});});
    var top2=Object.keys(c2).sort(function(a,b){return c2[b]-c2[a];}).slice(0,8);
    h+='<div class="l-card"><h4>关联题材 TOP（成分重合）</h4>'+
      top2.map(function(x){return '<span class="r-tag thm" data-go="theme" data-id="'+esc(x)+'">'+esc((THEMES[x]||{}).name||x)+' <b>'+c2[x]+'</b></span>';}).join('')+'</div>';
  }
  $('#live').innerHTML=h;
}

/* ---------- 渲染 ---------- */
function renderAll(){
  var t='题材工作台', meta=DAY?DAY.date+' · 收盘':'';
  if(selected){
    if(selected.type==='theme'){ t=(THEMES[selected.id]||{}).name; $('#content').innerHTML=themeDetail(selected.id); }
    else if(selected.type==='sector'){ t=(SECTORS[selected.id]||{}).name; $('#content').innerHTML=sectorDetail(selected.id); }
    else { $('#content').innerHTML=''; }
  } else { $('#content').innerHTML='<div class="empty" style="margin-top:8vh">从左侧选择题材或板块开始浏览</div>'; }
  $('#mainTitle').textContent = (selected? (selected.type==='theme'?'📚 ':'📊 ') : '') + t;
  $('#mainMeta').textContent = meta;
  bindContent();
  renderIndex(); renderLive();
}
function bindContent(){
  $('#content').querySelectorAll('[data-stk]').forEach(function(c){ c.addEventListener('click',function(){ selected={type:'stock',id:c.dataset.stk}; renderAll(); }); });
  $('#content').querySelectorAll('[data-go]').forEach(function(c){ c.addEventListener('click',function(){ selected={type:c.dataset.go,id:c.dataset.id}; renderAll(); }); });
  $('#content').querySelectorAll('[data-con]').forEach(function(c){ c.addEventListener('click',function(){ /* 概念过滤：原型暂跳转题材列表搜索 */ $('#idxSearch').value=c.dataset.con; if(idxMode!=='theme'){ idxMode='theme'; } renderIndex(); }); });
}
$('#idxSearch').addEventListener('input', renderIndex);
$('#live').addEventListener('click', function(e){ var go=e.target.closest('[data-go]'); if(go){ selected={type:go.dataset.go,id:go.dataset.id}; renderAll(); } });
document.querySelectorAll('.idx-btn').forEach(function(b){ b.addEventListener('click',function(){
  document.querySelectorAll('.idx-btn').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
  idxMode=b.dataset.idx; sortKey = idxMode==='theme'?'zt':'st'; selected=null; renderSortBar(); renderIndex(); renderAll();
}); });

/* ===== 主题切换 ===== */
function applyTheme(t){ document.documentElement.dataset.theme = t; $('#themeToggle').textContent = t==='dark'?'☀️':'🌙'; }
function toggleTheme(){ var t = document.documentElement.dataset.theme==='dark'?'light':'dark'; applyTheme(t); try{ localStorage.setItem('dsh_theme', t); }catch(e){} }
try{ var saved = localStorage.getItem('dsh_theme'); if(saved) applyTheme(saved); }catch(e){}
var qTheme = (location.search.match(/theme=(\w+)/)||[])[1];
if(qTheme) applyTheme(qTheme === 'dark' ? 'dark' : 'light');
$('#themeToggle').addEventListener('click', toggleTheme);

loadAll().then(function(){
  renderSortBar();
  // 默认选中涨停数最高的题材，直接展示概念层级表
  var best=Object.keys(THEMES).sort(function(a,b){return (THEME_STOCKS[b]||[]).filter(ztOf).length-(THEME_STOCKS[a]||[]).filter(ztOf).length;})[0];
  if(best) selected={type:'theme',id:best};
  renderAll();
});
</script>
</body>
</html>
